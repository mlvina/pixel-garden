<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#352b46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Garden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>Pixel Garden</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-view="garden">
<header>
  <h1><canvas id="logo" role="img" aria-label="Pixel Garden"></canvas></h1>
  <div id="clock" class="chip"></div>
  <div id="hud"></div>
</header>
<main>
  <section id="garden" aria-label="Грядки"></section>
  <aside id="side" aria-label="Панель"></aside>
</main>
<nav id="nav" aria-label="Разделы"></nav>
<div id="overlay" hidden></div>
<div id="toast" role="status"></div>
<script src="gen.js"></script>
<script src="game.js"></script>
</body>
</html>
